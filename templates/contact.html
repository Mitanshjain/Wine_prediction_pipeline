{% extends "base.html" %}
{% block title %}WineIQ — Contact{% endblock %}

{% block extra_css %}
<style>
  .page-header { background:linear-gradient(135deg,#4a0e2c,#7b1d46); color:#fff; padding:48px 0 36px; }
  .form-card { border:none; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.07); max-width:580px; }
  .form-label { font-weight:600; font-size:.875rem; color:#4a0e2c; }
  .form-control { border-radius:10px; border:1.5px solid #e0ccd5; }
  .form-control:focus { border-color:#7b1d46; box-shadow:0 0 0 3px rgba(123,29,70,.1); }
  .btn-submit { background:linear-gradient(135deg,#7b1d46,#c9456a); color:#fff; border:none; border-radius:12px; padding:13px 40px; font-weight:700; }
  .btn-submit:hover { opacity:.9; color:#fff; }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <div class="container">
    <h1 style="font-weight:800"><i class="bi bi-envelope me-2"></i>Contact Us</h1>
    <p class="mb-0 opacity-75">Questions, feedback, or bugs? We'd love to hear from you.</p>
  </div>
</div>

<div class="container py-5">
  <div class="card form-card p-4 p-md-5">
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Message</label>
        <textarea name="message" class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
      </div>
      <button type="submit" class="btn btn-submit">
        <i class="bi bi-send me-2"></i>Send Message
      </button>
    </form>
  </div>
</div>
{% endblock %}
